<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias! | Vendemos Rápido</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="styles.css">
    <style>
        .thanks-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #0f2e2b, #123a36 60%, #0b2422);
            color: #fff;
            text-align: center;
            padding: 24px;
        }

        .thanks-card {
            max-width: 520px;
        }

        .thanks-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(34, 197, 94, .15);
            border: 1px solid rgba(34, 197, 94, .4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 34px;
            color: #22c55e;
        }

        .thanks-card h1 {
            font-size: clamp(26px, 4vw, 36px);
            margin: 0 0 14px;
        }

        .thanks-card p {
            color: rgba(255, 255, 255, .75);
            font-size: 16px;
            margin: 0 0 32px;
        }

        .thanks-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>

    <!-- Meta Pixel: config only. El pixel real solo se carga tras
         consentimiento de cookies de publicidad (ver cookie-consent.js) -->
    <script>
        window.metaPixelId = '1371434301763036';
        window.metaPixelEvents = ['PageView', 'Lead'];
    </script>
</head>

<body>
    <div class="thanks-wrap">
        <div class="thanks-card">
            <div class="thanks-icon">✓</div>
            <h1>¡Gracias! Hemos recibido tus datos.</h1>
            <p>Te contactaremos muy pronto para darte una oferta personalizada, sin ningún compromiso.</p>
            <div class="thanks-actions">
                <a href="index.html" class="btn btn-outline">Volver al inicio</a>
                <a href="https://wa.me/34664830230?text=Hola%2C%20acabo%20de%20rellenar%20el%20formulario"
                    class="btn btn-primary" target="_blank" rel="noopener noreferrer">Escribir por WhatsApp</a>
            </div>
            <button type="button" class="footer-cookie-settings" style="margin: 20px auto 0; text-align:center; color: rgba(255,255,255,.5);" onclick="window.CookieConsent && window.CookieConsent.openPreferences()">Configurar cookies</button>
        </div>
    </div>

    <script src="cookie-consent.js" defer></script>
</body>

</html>
